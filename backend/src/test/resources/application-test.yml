spring:
  datasource:
    url: jdbc:h2:mem:almoxarifado;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/almoxarifado
          jwk-set-uri: http://localhost:8181/realms/almoxarifado/protocol/openid-connect/certs
