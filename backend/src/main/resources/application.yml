spring:
  application:
    name: almoxarifado
  profiles:
    default: local
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # A execução real ocorre por módulo em FlywayModulosConfig (schema + histórico próprios).
    enabled: true
    baseline-on-migrate: false
  modulith:
    events:
      jdbc:
        schema: modulith
        schema-initialization:
          enabled: false            # tabela criada via Flyway (db/migration/modulith)
      republish-outstanding-events-on-restart: true
      completion-mode: update       # mantém histórico das publicações para auditoria
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/almoxarifado}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8181/realms/almoxarifado/protocol/openid-connect/certs}
          audiences: almoxarifado-backend

server:
  port: 8080
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

almoxarifado:
  keycloak-admin:
    enabled: ${KEYCLOAK_ADMIN_ENABLED:false}
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8181}
    realm: almoxarifado
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:almoxarifado-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.modulith: INFO
